name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k actions "$RUNNER_TEMP/build.keychain"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "rchamber") | .version')"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Build app and disk image
        run: bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RustChamber-macos
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          retry() {
            local attempt=1 max=5 status
            until "$@"; do
              status=$?
              if (( attempt >= max )); then
                echo "::error::$(printf '%q ' "$@") failed after $max attempts" >&2
                return $status
              fi
              echo "Attempt $attempt failed; retrying in $(( attempt * 5 ))s" >&2
              sleep $(( attempt * 5 ))
              attempt=$(( attempt + 1 ))
            done
          }

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          # Create as a draft so a transient API failure never leaves a
          # half-published release behind, then upload and publish.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            retry gh release create "$GITHUB_REF_NAME" \
              --title "RustChamber $VERSION" --generate-notes --draft
          fi

          retry gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --clobber
          retry gh release edit "$GITHUB_REF_NAME" --draft=false ${prerelease[@]+"${prerelease[@]}"}

          gh release view "$GITHUB_REF_NAME" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease,
                   assets: [.assets[].name]}'

  homebrew:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
