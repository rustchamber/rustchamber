name: Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Release version, with or without the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  cask:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: rustchamber/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update cask
        working-directory: tap
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          DMG="RustChamber-${VERSION}-macos-universal.dmg"
          URL="https://github.com/rustchamber/rustchamber/releases/download/v${VERSION}/${DMG}"

          curl -fsSL "$URL" -o "$RUNNER_TEMP/app.dmg"
          SHA="$(sha256sum "$RUNNER_TEMP/app.dmg" | cut -d' ' -f1)"

          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/rustchamber.rb

          if git diff --quiet; then
            echo "Cask already at ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update rustchamber to ${VERSION}"
          git push
