# Flathub manifest.
#
# The `tag` source must point at the public release tag. Add the matching
# `commit` before submitting to Flathub, or let the Flathub review ask for it.
# Local development should use dev.rustchamber.RustChamber.local.yml instead.

app-id: dev.rustchamber.RustChamber
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rchamber
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=ssh-auth
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --env=RCHAMBER_OPENCODE_BIN=/app/bin/opencode
modules:
  - name: rustchamber
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rustchamber/cargo
        CARGO_NET_OFFLINE: 'true'
        RCHAMBER_VERSION: 0.2.7-beta
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/rchamber /app/bin/rchamber
      - install -Dm644 packaging/linux/dev.rustchamber.RustChamber.desktop /app/share/applications/dev.rustchamber.RustChamber.desktop
      - install -Dm644 packaging/linux/dev.rustchamber.RustChamber.metainfo.xml /app/share/metainfo/dev.rustchamber.RustChamber.metainfo.xml
      - for size in 128 256 512; do install -Dm644 "packaging/linux/icons/hicolor/${size}x${size}/apps/dev.rustchamber.RustChamber.png" "/app/share/icons/hicolor/${size}x${size}/apps/dev.rustchamber.RustChamber.png"; done
      - install -Dm644 LICENSE /app/share/doc/rustchamber/LICENSE
      - install -Dm644 NOTICE /app/share/doc/rustchamber/NOTICE
      - install -Dm644 README.md /app/share/doc/rustchamber/README.md
      - install -Dm755 packaging/flatpak/bin/opencode /app/bin/opencode
      - install -Dm755 packaging/flatpak/bin/git /app/bin/git
      - install -Dm755 packaging/flatpak/bin/host-shell /app/bin/host-shell
      - install -Dm755 packaging/flatpak/bin/xdg-open /app/bin/xdg-open
      - install -Dm755 packaging/flatpak/bin/magick /app/bin/magick
      - install -Dm755 packaging/flatpak/bin/convert /app/bin/convert
      - install -Dm755 packaging/flatpak/bin/heif-convert /app/bin/heif-convert
      - install -Dm755 packaging/flatpak/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm644 packaging/flatpak/bin/host-env.sh /app/bin/host-env.sh
    sources:
      - type: git
        url: https://github.com/rustchamber/rustchamber.git
        tag: v0.2.7-beta
        commit: e6f2c1c312e696f8ba4e2885e2fa269b19935907
      - cargo-sources.json
